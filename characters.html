
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Characters | FIX ANIME STUDIO</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080914;color:#f4f3ff;font-family:Arial,sans-serif}
header{height:75px;padding:0 7%;display:flex;align-items:center;justify-content:space-between;background:#101124;border-bottom:1px solid #29264b;position:sticky;top:0;z-index:5}
.logo{font-size:21px;font-weight:900;color:white;text-decoration:none}.logo span{color:#a78bfa}
nav{display:flex;gap:22px}nav a{color:#c8c3e7;text-decoration:none;font-size:14px}
nav a:hover{color:#c4b5fd}
main{max-width:1200px;margin:auto;padding:55px 22px}
.hero{text-align:center;margin-bottom:35px}
.tag{color:#a78bfa;letter-spacing:4px;font-size:12px;font-weight:bold}
h1{font-size:clamp(34px,6vw,60px);margin:14px 0}
.hero p{color:#aaa8c4;line-height:1.7}
.controls{display:flex;gap:12px;flex-wrap:wrap;margin:30px 0}
input,select{background:#14152a;border:1px solid #37345e;color:white;padding:14px;border-radius:10px;outline:none}
input{flex:1;min-width:180px}
select{min-width:145px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px}
.card{background:linear-gradient(145deg,#17182f,#10111e);border:1px solid #302d53;border-radius:18px;overflow:hidden;transition:.25s}
.card:hover{transform:translateY(-6px);border-color:#9b7cff}
.art{height:270px;background:radial-gradient(circle at center,#39306a,#141526 70%);display:flex;align-items:center;justify-content:center;overflow:hidden}
.art img{width:100%;height:100%;object-fit:cover}
.placeholder{font-size:90px}
.info{padding:19px}
.info h2{font-size:21px;margin-bottom:8px}
.info p{color:#aaa8c4;font-size:13px;line-height:1.6;min-height:42px}
.pills{display:flex;gap:7px;flex-wrap:wrap;margin:13px 0}
.pill{font-size:11px;padding:6px 10px;border-radius:20px;background:#302653;color:#d8caff}
.detail{color:#c4b5fd;font-size:13px;line-height:1.7}
.empty{text-align:center;color:#aaa8c4;padding:60px 10px;grid-column:1/-1}
footer{text-align:center;padding:35px;color:#77758f;border-top:1px solid #24233c}
@media(max-width:600px){header{padding:0 15px}nav{gap:10px}nav a{font-size:12px}.art{height:230px}}
</style>
</head>
<body>
<header>
<a class="logo" href="index.html">FIX <span>ANIME</span> STUDIO</a>
<nav>
<a href="index.html">Home</a>
<a href="characters.html">Characters</a>
<a href="admin.html">Admin</a>
</nav>
</header>

<main>
<section class="hero">
<div class="tag">✦ THE ANIME UNIVERSE ✦</div>
<h1>Character <span style="color:#a78bfa">Gallery</span></h1>
<p>Discover heroes, villains, warriors and legends from FIX ANIME STUDIO.</p>
</section>

<div class="controls">
<input id="search" placeholder="Search characters..." oninput="render()">
<select id="type" onchange="render()">
<option value="all">All Characters</option>
<option value="2D">2D Anime</option>
<option value="3D">3D Anime</option>
</select>
<select id="role" onchange="render()">
<option value="all">All Roles</option>
<option>Hero</option><option>Villain</option><option>Warrior</option>
<option>Princess</option><option>Other</option>
</select>
</div>

<section class="grid" id="gallery"></section>
</main>

<footer>© 2026 FIX ANIME STUDIO · Create Your Own Universe</footer>

<script>
const KEY="fixAnimeCharacters";
const defaults=[
{id:1,name:"Akira Storm",role:"Hero",type:"2D",power:"Thunder Strike",story:"A brave young hero who protects his world with the power of thunder.",image:"",emoji:"⚡"},
{id:2,name:"Kage Shadow",role:"Warrior",type:"2D",power:"Shadow Control",story:"A mysterious warrior who can move through the shadows.",image:"",emoji:"🥷"},
{id:3,name:"Lord Zareth",role:"Villain",type:"3D",power:"Dark Energy",story:"A powerful villain who wants to control the universe.",image:"",emoji:"👿"},
{id:4,name:"Ryu Blaze",role:"Warrior",type:"3D",power:"Inferno Flame",story:"A fire warrior with a fearless heart.",image:"",emoji:"🔥"},
{id:5,name:"Yuki Frost",role:"Princess",type:"2D",power:"Frozen Storm",story:"A princess who protects her kingdom with ice magic.",image:"",emoji:"❄️"},
{id:6,name:"Drakon Vey",role:"Other",type:"3D",power:"Dragon Soul",story:"A legendary guardian connected to ancient dragons.",image:"",emoji:"🐉"}
];

function getCharacters(){
 try{
  const saved=localStorage.getItem(KEY);
  if(saved!==null){
   const data=JSON.parse(saved);
   if(Array.isArray(data))return data;
  }
 }catch(e){}
 localStorage.setItem(KEY,JSON.stringify(defaults));
 return defaults;
}
function safe(s){
 return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const type=document.getElementById("type").value;
 const role=document.getElementById("role").value;
 const list=getCharacters().filter(c=>
  (type==="all"||c.type===type)&&
  (role==="all"||c.role===role)&&
  [c.name,c.power,c.story,c.role].join(" ").toLowerCase().includes(q)
 );
 const gallery=document.getElementById("gallery");
 if(!list.length){
  gallery.innerHTML='<div class="empty"><h2>No characters found</h2><p>Try another search or add characters from Admin Panel.</p></div>';
  return;
 }
 gallery.innerHTML=list.map(c=>`
 <article class="card">
  <div class="art">
   ${c.image?`<img src="${safe(c.image)}" alt="${safe(c.name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">`:''}
   <div class="placeholder" style="${c.image?'display:none':''}">${safe(c.emoji||"🎭")}</div>
  </div>
  <div class="info">
   <h2>${safe(c.name)}</h2>
   <div class="pills"><span class="pill">${safe(c.type||"2D")}</span><span class="pill">${safe(c.role||"Other")}</span></div>
   <p>${safe(c.story||"No story added yet.")}</p>
   <div class="detail">✦ Power: ${safe(c.power||"Unknown")}</div>
  </div>
 </article>`).join("");
}
window.addEventListener("storage",render);
render();
</script>
</body>
</html>
